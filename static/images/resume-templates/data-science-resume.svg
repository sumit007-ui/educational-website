<?xml version="1.0" encoding="UTF-8"?>
<svg width="200" height="200" viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg">
    <!-- Background Circle -->
    <circle cx="100" cy="100" r="90" fill="#E8F5E9"/>
    
    <!-- Bar Chart -->
    <rect x="60" y="120" width="20" height="40" fill="#4CAF50"/>
    <rect x="90" y="90" width="20" height="70" fill="#4CAF50"/>
    <rect x="120" y="60" width="20" height="100" fill="#4CAF50"/>
    
    <!-- Data Points -->
    <circle cx="70" cy="120" r="4" fill="#4CAF50"/>
    <circle cx="100" cy="90" r="4" fill="#4CAF50"/>
    <circle cx="130" cy="60" r="4" fill="#4CAF50"/>
    
    <!-- Connecting Line -->
    <path d="M70 120L100 90L130 60" stroke="#4CAF50" stroke-width="2" stroke-dasharray="4 4"/>
</svg>
