<?xml version="1.0" encoding="UTF-8"?>
<svg width="800" height="600" viewBox="0 0 800 600" fill="none" xmlns="http://www.w3.org/2000/svg">
    <!-- Background Elements -->
    <circle cx="400" cy="300" r="250" fill="#1a1a1a" opacity="0.1"/>
    <circle cx="400" cy="300" r="200" fill="#333333" opacity="0.1"/>
    
    <!-- Laptop Base -->
    <path d="M250 350 L550 350 L600 450 L200 450 Z" fill="#333333"/>
    <rect x="270" y="200" width="260" height="150" rx="10" fill="#1a1a1a"/>
    
    <!-- Screen Content -->
    <rect x="290" y="220" width="220" height="110" fill="#000000"/>
    
    <!-- Code Lines -->
    <rect x="300" y="230" width="140" height="4" rx="2" fill="#ff0000"/>
    <rect x="300" y="245" width="120" height="4" rx="2" fill="#666666"/>
    <rect x="300" y="260" width="160" height="4" rx="2" fill="#666666"/>
    <rect x="300" y="275" width="100" height="4" rx="2" fill="#ff0000"/>
    <rect x="300" y="290" width="130" height="4" rx="2" fill="#666666"/>
    <rect x="300" y="305" width="140" height="4" rx="2" fill="#ff0000"/>
    
    <!-- Floating Elements -->
    <circle cx="600" cy="200" r="30" fill="#ff0000" opacity="0.2"/>
    <circle cx="650" cy="250" r="20" fill="#ff0000" opacity="0.15"/>
    <circle cx="200" cy="220" r="25" fill="#ff0000" opacity="0.1"/>
    <circle cx="150" cy="280" r="15" fill="#ff0000" opacity="0.2"/>
    
    <!-- Abstract Lines -->
    <path d="M100 150 Q 200 50 300 150" stroke="#ff0000" stroke-width="2" fill="none" opacity="0.3"/>
    <path d="M500 100 Q 600 200 700 100" stroke="#ff0000" stroke-width="2" fill="none" opacity="0.3"/>
    
    <!-- Decorative Dots -->
    <circle cx="150" cy="150" r="3" fill="#ff0000"/>
    <circle cx="650" cy="150" r="3" fill="#ff0000"/>
    <circle cx="400" cy="100" r="3" fill="#ff0000"/>
    <circle cx="200" cy="400" r="3" fill="#ff0000"/>
    <circle cx="600" cy="400" r="3" fill="#ff0000"/>
    
    <!-- Animated Elements (Add CSS animation in your stylesheet) -->
    <g class="floating">
        <rect x="180" y="180" width="20" height="20" rx="5" fill="#ff0000" opacity="0.2"/>
        <rect x="600" cy="300" width="15" height="15" rx="4" fill="#ff0000" opacity="0.2"/>
        <circle cx="500" cy="150" r="10" fill="#ff0000" opacity="0.2"/>
    </g>
</svg>
