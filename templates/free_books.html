{% extends 'base.html' %}

{% block title %}Free Books{% endblock %}

{% block content %}
<h1>Free Books</h1>
<p>Search for free books from Open Library and other sources.</p>

<!-- Search Form -->
<form action="{{ url_for('free_books_search') }}" method="get" class="mb-4">
    <div class="input-group">
        <input type="text" class="form-control" placeholder="Search by title, author, or subject..." name="query" required>
        <button class="btn btn-primary" type="submit">
            <i class="fas fa-search"></i> Search
        </button>
    </div>
</form>
{% endblock %}
